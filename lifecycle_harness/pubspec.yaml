name: audio_service_lifecycle_harness
description: "Standalone Android instrumentation harness for AudioService / FlutterEngine lifecycle."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  audio_service:
    path: ../audio_service

dev_dependencies:
  flutter_lints: ^6.0.0

dependency_overrides:
  # Exercise this checkout as one coherent workspace rather than mixing the
  # local plugin with hosted platform packages.
  audio_service_platform_interface:
    path: ../audio_service_platform_interface
  audio_service_web:
    path: ../audio_service_web
